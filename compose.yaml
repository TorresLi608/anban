services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${ANBAN_ADDR:-127.0.0.1:8024}:8024"
    environment:
      ANBAN_ADDR: "0.0.0.0:8024"
      ANBAN_ORIGINS: "${ANBAN_ORIGINS:-}"
      ANBAN_ADMIN_USERNAME: "${ANBAN_ADMIN_USERNAME:-admin}"
      ANBAN_ADMIN_PASSWORD: "${ANBAN_ADMIN_PASSWORD:-}"
      ANBAN_PUBLIC_URL: "${ANBAN_PUBLIC_URL:-}"
      ANBAN_NTFY_URL: "http://ntfy:80"
      ANBAN_NTFY_PUBLIC_URL: "${ANBAN_NTFY_PUBLIC_URL:-}"
      ANBAN_NTFY_TOKEN: "${ANBAN_NTFY_TOKEN:-}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in .env}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-true}"
      MINIO_BUCKET: "${MINIO_BUCKET:-anban}"
      TZ: "Asia/Shanghai"
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8024/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    ports:
      - "8026:80"
    environment:
      NTFY_BASE_URL: "${ANBAN_NTFY_PUBLIC_URL:-http://127.0.0.1:8026}"
      NTFY_LISTEN_HTTP: ":80"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      - ntfy_data:/var/lib/ntfy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  admin:
    build:
      context: ./admin
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ANBAN_ADMIN_ADDR:-127.0.0.1:8025}:8025"
    environment:
      ANBAN_ADMIN_API_URL: "http://backend:8024"
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "8025"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8025/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ntfy_data:
