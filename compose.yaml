services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${ANBAN_BIND_IP:-127.0.0.1}:${ANBAN_PORT:-8024}:8024"
    environment:
      ANBAN_ADDR: "0.0.0.0:8024"
      ANBAN_ORIGINS: "${ANBAN_ORIGINS:-}"
      ANBAN_ADMIN_USERS: "${ANBAN_ADMIN_USERS:-}"
      ANBAN_PUBLIC_URL: "${ANBAN_PUBLIC_URL:-}"
      ANBAN_ANDROID_VERSION_CODE: "${ANBAN_ANDROID_VERSION_CODE:-}"
      ANBAN_ANDROID_VERSION_NAME: "${ANBAN_ANDROID_VERSION_NAME:-}"
      ANBAN_ANDROID_DOWNLOAD_URL: "${ANBAN_ANDROID_DOWNLOAD_URL:-}"
      ANBAN_ANDROID_RELEASE_NOTES: "${ANBAN_ANDROID_RELEASE_NOTES:-}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in .env}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-true}"
      MINIO_BUCKET: "${MINIO_BUCKET:-anban}"
      TZ: "${TZ:-Asia/Shanghai}"
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8024/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  admin:
    build:
      context: ./admin
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ANBAN_BIND_IP:-127.0.0.1}:${ANBAN_ADMIN_PORT:-8025}:8025"
    environment:
      ANBAN_ADMIN_API_URL: "http://backend:8024"
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "8025"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8025/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
